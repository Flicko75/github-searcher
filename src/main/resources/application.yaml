spring:
  application:
    name: github-searcher

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/github_searcher}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

github:
  api:
    base-url: https://api.github.com